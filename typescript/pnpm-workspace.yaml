packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@cloudflare/vite-plugin": 2.0.0-beta.v.15
  "@cloudflare/vitest-plugin": 1.8.0
  "@hono/zod-validator": ^0.9.1
  "@noble/curves": ^2.4.0
  "@noble/hashes": ^2.4.0
  "@types/node": ^26.6.5
  cf: 1.0.0-beta.30
  hono: ^4.13.18
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  viem: ^2.57.19
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
